services:
  seq:
    image: datalust/seq:latest
    ports:
      - "5341:80"
      - "5342:5342"
    environment:
      - ACCEPT_EULA=Y
    volumes:
      - seq-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "(echo -e 'GET /api/events HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' | timeout 2 bash -c 'cat > /dev/tcp/localhost/80' && sleep 0.1) || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  seq-data:
